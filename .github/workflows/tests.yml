name: tests

on:
  push:
  pull_request:

jobs:
  temporal-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scipy scikit-learn tqdm torch pytest
      - run: pytest -q
